name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF6B8B&color_dots=#ebedf0,#d9d3ff,#b3a6ff,#8b7cff,#5b4bd6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF6B8B&color_dots=#161b22,#2e2358,#4a3a8f,#6f5fe0,#b3a6ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
