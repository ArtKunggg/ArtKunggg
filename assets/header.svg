  <text x="133.5" y="261" text-anchor="middle" fill="#89BFFF" font-family="Segoe UI,Arial,sans-serif" font-size="14">Web development</text>
  <rect x="229" y="238" width="126" height="35" rx="17.5" fill="#132D30" stroke="#27514C"/>
  <text x="292" y="261" text-anchor="middle" fill="#7BE4C7" font-family="Segoe UI,Arial,sans-serif" font-size="14">Python bots</text>
  <rect x="367" y="238" width="151" height="35" rx="17.5" fill="#15293D" stroke="#2A455F"/>
  <text x="442.5" y="261" text-anchor="middle" fill="#A9CBE8" font-family="Segoe UI,Arial,sans-serif" font-size="14">AI experiments</text>
