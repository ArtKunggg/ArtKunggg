<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <title>Panuwat — ArtKunggg</title>
  <desc>A navy profile banner with blue and mint accents and a code window.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B30"/><stop offset="0.6" stop-color="#0B1322"/><stop offset="1" stop-color="#102B32"/>
    </linearGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="1152" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AA9FF"/><stop offset="1" stop-color="#63E6BE"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#8AB8E8" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#background)" stroke="#24384E"/>
  <rect x="24" y="24" width="1152" height="312" rx="16" fill="url(#grid)"/>
  <rect x="48" y="40" width="44" height="4" rx="2" fill="url(#accent)"/>
