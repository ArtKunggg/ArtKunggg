  <text x="48" y="154" fill="#EDF6FF" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">PANUWAT<tspan fill="#63E6BE">.</tspan></text>
  <text x="52" y="202" fill="#B2C9DD" font-family="Segoe UI,Arial,sans-serif" font-size="24">Ideas into apps. Curiosity into code.</text>
