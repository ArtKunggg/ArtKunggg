  <path d="M750 112H1125" stroke="#23394D"/>
  <circle cx="772" cy="92" r="4" fill="#5AA9FF"/><circle cx="788" cy="92" r="4" fill="#63E6BE"/><circle cx="804" cy="92" r="4" fill="#40556B"/>
  <text x="1105" y="97" text-anchor="end" fill="#7794AF" font-family="Consolas,monospace" font-size="12">hello.py</text>
  <g font-family="Consolas,monospace" font-size="17">
    <text x="774" y="147" fill="#40586E">01</text><text x="811" y="147" fill="#88BAFF">def <tspan fill="#63E6BE">build</tspan><tspan fill="#CCDCEE">(idea):</tspan></text>
    <text x="774" y="178" fill="#40586E">02</text><text x="831" y="178" fill="#CCDCEE">learn()</text>
    <text x="774" y="209" fill="#40586E">03</text><text x="831" y="209" fill="#CCDCEE">create(idea)</text>
    <text x="774" y="240" fill="#40586E">04</text><text x="831" y="240" fill="#CCDCEE">keep_exploring()</text>
  </g>
  <rect x="811" y="257" width="9" height="16" rx="1" fill="#63E6BE"/>
  <path d="M48 318H1152" stroke="url(#accent)" stroke-opacity="0.45"/>
